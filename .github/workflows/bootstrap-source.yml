name: Expand source archive and build Android

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-source-main
  cancel-in-progress: false

jobs:
  expand-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-*.b64 | base64 --decode > .bootstrap/source.tar.xz
          printf '%s  %s\n' '85e85bbb3f11965cbcb5aa02b0df8355ef75ebbc6aee025e2d3a98af07bd42a0' '.bootstrap/source.tar.xz' | sha256sum --check -
          xz --test .bootstrap/source.tar.xz
          tar -xJf .bootstrap/source.tar.xz -C .
          rm -rf .bootstrap
          rm -f BOOTSTRAP-NOTES.md BOOTSTRAP-WINDOWS.ps1 RetroMobileWorld-Bootstrap-Windows.ps1
          # The GitHub Actions token cannot push changes that add another workflow.
          # Add android-ci.yml later through the repository's authorised GitHub connection.
          rm -f .github/workflows/android-ci.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate profile and catalogue registries
        run: python scripts/validate_registry.py

      - name: Commit expanded project tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Retro Mobile World application source tree"
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: retro-mobile-world-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
