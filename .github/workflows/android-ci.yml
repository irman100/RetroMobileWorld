name: Android CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-c3emu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate device profiles and catalogue
        run: python scripts/validate_registry.py

      - name: Test firmware inspection tooling
        run: python -m unittest discover -s scripts/tests -v

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0 with dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform, build tools and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          yes | sdkmanager --licenses >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Test bounded c3emu MMIO diagnostic
        working-directory: engine/c3emu-web-android
        run: cargo test

      - name: Build c3emu JNI libraries for Android ABIs
        working-directory: engine/c3emu-android
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o ../../app/src/main/jniLibs \
            build --release
          test -s ../../app/src/main/jniLibs/arm64-v8a/libc3emu_android.so
          test -s ../../app/src/main/jniLibs/armeabi-v7a/libc3emu_android.so
          test -s ../../app/src/main/jniLibs/x86_64/libc3emu_android.so

      - name: Run Android unit tests
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            set +e
            output="$(gradle --no-daemon :app:testDebugUnitTest 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then exit 0; fi
            if ! printf '%s' "$output" | grep -Eiq 'HTTP[^0-9]*5[0-9][0-9]|timed out|Could not GET|Could not download|Could not resolve'; then
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then exit "$status"; fi
            echo "Transient dependency/distribution server failure; retrying Gradle tests (attempt $((attempt + 1))/3)." >&2
            sleep $((attempt * 20))
          done

      - name: Assemble debug APK
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            set +e
            output="$(gradle --no-daemon :app:assembleDebug 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then exit 0; fi
            if ! printf '%s' "$output" | grep -Eiq 'HTTP[^0-9]*5[0-9][0-9]|timed out|Could not GET|Could not download|Could not resolve'; then
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then exit "$status"; fi
            echo "Transient dependency server failure; retrying APK assembly (attempt $((attempt + 1))/3)." >&2
            sleep $((attempt * 20))
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: retro-mobile-world-c3emu-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
