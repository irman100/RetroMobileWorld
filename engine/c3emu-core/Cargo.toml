[package]
name = "c3emu"
description = "Nokia C3-00 (Series 40) emulator"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
default = ["desktop"]
desktop = ["dep:minifb", "dep:cpal"]
disasm = ["dep:capstone"]
unicorn = ["dep:unicorn-engine"]

[dependencies]
png = "0.18.1"
serde_json = "1.0.151"
minifb = { version = "0.28.0", optional = true }
cpal = { version = "0.15", optional = true }
capstone = { version = "0.14", optional = true }
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_arm"], optional = true }

[[bin]]
name = "c3emu"
required-features = ["desktop"]
